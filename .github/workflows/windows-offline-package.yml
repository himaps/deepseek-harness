name: Package · Windows · x64 · offline installer

# Build deepseek-harness-windows-x64-setup.exe: the self-contained dsh CLI runtime
# (bundled Node.js, pnpm, Python) as an NSIS installer for machines without network
# access. Windows has no system-package manager to disturb, so there is no dependency
# closure and no system-component risk; the installer touches only its install directory
# and one machine PATH entry, both removed by its uninstaller.
on:
  push:
    tags:
      - 'offline-pkg-v*'
  workflow_dispatch:
    inputs:
      source_ref:
        description: '构建源：仓库分支或 dsh-v* tag；推送 offline-pkg-v* tag 时自动取该 tag'
        type: string
        default: master
        required: true

permissions:
  # The build attaches its installer to the tag's GitHub Release.
  contents: write

concurrency:
  group: windows-offline-package-${{ inputs.source_ref || github.ref }}
  cancel-in-progress: false

env:
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  build:
    name: Build offline installer
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      # pnpm v11 ships no darwin-x64 standalone binary, and the pnpm/action-setup
      # v6 self-update path needs one; this job stays on the v5 npm-install line.
      - uses: pnpm/action-setup@v5.0.0
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The dsh release family refuses to pack from anything but a complete official
      # build, and this is the same build the npm release ships.
      - name: Build official artifacts
        run: pnpm run build:official

      # NSIS is neither on PATH nor guaranteed at the default directory on this image;
      # fall back to installing it with Chocolatey. GITHUB_PATH carries the location to
      # the later steps that resolve makensis through PATH.
      - name: Locate NSIS
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            $found = 'C:\Program Files (x86)\NSIS', 'C:\Program Files\NSIS' |
              Where-Object { Test-Path (Join-Path $_ 'makensis.exe') } |
              Select-Object -First 1
            if (-not $found) {
              choco install nsis -y --no-progress
              $found = 'C:\Program Files (x86)\NSIS'
            }
            Add-Content $env:GITHUB_PATH $found
          }

      # Packs the dsh and vendor release families, prepares the win-x64 primary runtime,
      # installs the CLI from the packed tarballs, and compiles installer.nsi with the
      # runner's NSIS. Failures tee the log tail into ::error:: annotations and the full
      # log into an artifact uploaded by the failure step below.
      - name: Build the installer
        run: |
          $log = 'dist/win/logs/build-installer.log'
          New-Item -ItemType Directory -Force (Split-Path $log) | Out-Null
          pnpm exec tsx apps/cli/packaging/windows-x64/build-installer.ts `
            --output dist/win --work dist/win/work --cache dist/win/cache --concurrency 4 2>&1 |
            Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            Get-Content $log -Tail 10 | ForEach-Object { "::error::$_" }
            "### build-installer log tail" | Add-Content $env:GITHUB_STEP_SUMMARY
            '<pre>' | Add-Content $env:GITHUB_STEP_SUMMARY
            Get-Content $log -Tail 200 | Add-Content $env:GITHUB_STEP_SUMMARY
            '</pre>' | Add-Content $env:GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-build-logs
          path: dist/win/logs/*.log
          if-no-files-found: ignore

      - name: Payload smoke on the build host
        run: |
          & "dist/win/work/staging/deepseek-harness/runtime/primary-runtime/dependencies/node/bin/node.exe" `
            "dist/win/work/staging/deepseek-harness/dsh/node_modules/@deepseek-ai/dsh/lib/bin.js" --version

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: deepseek-harness-windows-x64
          path: dist/win/deepseek-harness-windows-x64-setup.exe
          if-no-files-found: error

      # Attach the installer to the tag's GitHub Release (shared with the Kylin workflow;
      # whichever finishes first creates it). The asset is replaced on re-runs.
      - name: Publish to the tag release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#offline-pkg-v}"
          {
            echo "# DeepSeek Harness offline packages (${GITHUB_REF_NAME})"
            echo
            echo '- `deepseek-harness-kylin-v10-sp1-aarch64.deb` — 银河麒麟 V10 SP1 (arm64) 离线安装包：自包含 dsh CLI 运行时（内置 Node.js/pnpm/Python），`dpkg -i` 安装后 `/usr/bin/dsh` 全局可用；git/tmux/openssh-client 依赖闭包已内置，`install-deps.sh` 只装缺失、绝不升级系统组件。'
            echo '- `deepseek-harness-windows-x64-setup.exe` — Windows x64 离线安装包：NSIS 安装到 `%PROGRAMFILES64%\deepseek-harness` 并写入机器 PATH，卸载器完整还原。'
            echo
            echo '两份产物均在 focal（glibc 2.31）同源基线或其验证容器中通过：零升级断言、ldd 零缺失、CLI 冒烟。'
          } > release-notes.md
          ok=0
          for attempt in 1 2 3 4 5; do
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              ok=1
              break
            fi
            if gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "DeepSeek Harness offline packages · ${version}" \
              --notes-file release-notes.md > /dev/null 2>&1; then
              ok=1
              break
            fi
            echo "release create attempt ${attempt} failed; retrying"
            sleep 15
          done
          [ "$ok" -eq 1 ] || { echo "::error::the tag release could not be created"; exit 1; }
          for attempt in 1 2 3 4 5; do
            if gh release upload "$GITHUB_REF_NAME" \
              dist/win/deepseek-harness-windows-x64-setup.exe --clobber --repo "$GITHUB_REPOSITORY"; then
              break
            fi
            echo "release upload attempt ${attempt} failed; retrying"
            sleep 15
          done
